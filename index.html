<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradienViz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    :root {
      --bg:       #0f0f13;
      --surface:  #1a1a22;
      --border:   #333344;
      --text:     #c8c8d8;
      --text-dim: #7a7a9a;
      --accent:   #60a5fa;
      --orange:   #f97316;
      --green:    #22c55e;
      --yellow:   #fbbf24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 36px;
    }

    #header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    #header .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 12px;
    }

    #main {
      display: grid;
      grid-template-columns: 1fr 220px;
      grid-template-rows: 1fr;
      height: calc(100vh - 36px);
      min-height: 640px;   /* si la ventana es más baja, el body hace scroll */
      gap: 12px;
      padding: 12px;
    }

    #canvas-wrap {
      grid-column: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* Banda de acciones: se posiciona desde JS sobre el hueco reservado
       en la columna izquierda del canvas, entre el panel de datos y J(t). */
    #acciones {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }

    #defaultCanvas0 {
      display: block !important;
    }

    #sidebar {
      grid-column: 2;
      align-self: start;          /* altura natural — sin hueco muerto */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ctrl-section { display: flex; flex-direction: column; gap: 8px; }

    .ctrl-section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .ctrl-row { display: flex; flex-direction: column; gap: 3px; }

    .ctrl-label {
      font-size: 14px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .ctrl-label .val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: var(--text);
    }

    .ctrl-row input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 14px;
    }

    .ctrl-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-inline label {
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type=number] {
      width: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .btn {
      width: 100%;
      padding: 10px 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover  { background: var(--border); border-color: var(--accent); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary { background: #1d3a6e; border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #254d9a !important; }

    .btn-danger  { border-color: #7f1d1d; color: #fca5a5; }
    .btn-danger:hover  { background: #3d0a0a !important; }

    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-group .btn {
      flex: 1;
      padding: 8px 0;
      font-size: 12px;
    }

    /* ── Modo simple ────────────────────────────────────────────
       La clase la aplica JS (aplicarClaseModo) usando el MISMO
       criterio que esModoSimple(): únicamente el ancho de ventana.
       No hay media query: así CSS y lógica de dibujo no pueden
       desincronizarse y no existe un "modo intermedio". */
    body.modo-simple #main {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      height: auto;
      min-height: 0;
      gap: 8px;
      padding: 8px;
    }

    body.modo-simple #canvas-wrap {
      grid-column: 1;
      height: auto;
    }

    body.modo-simple #acciones { display: none; }

    body.modo-simple #defaultCanvas0 { touch-action: manipulation; }

    /* Fila de acceso rápido: J(t) + Entrenar/Reiniciar, justo bajo el
       heatmap. Solo existe en modo simple; en modo ancho permanece
       oculta y vacía (crearControles no la puebla). */
    #accSimple {
      display: none;
    }
    body.modo-simple #accSimple {
      grid-column: 1;
      display: grid;
      grid-template-columns: 1fr 108px;
      gap: 8px;
      align-items: stretch;
      padding: 10px 10px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    #accSimple .accSimple-jt {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    #accSimple .accSimple-botones {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #accSimple .accSimple-botones .btn {
      flex: 1;
      padding: 0;
      font-size: 12px;
    }

    body.modo-simple #sidebar {
      grid-column: 1;
      width: 100%;
    }

    body.modo-simple #header { padding: 4px 8px; height: auto; }
    body.modo-simple #header h1 { font-size: 13px; }
    body.modo-simple #header .subtitle { font-size: 10px; }
  </style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:baseline">
    <h1>GradienViz</h1>
    <span class="subtitle">— Descenso por gradiente · Regresión lineal</span>
  </div>
  <span style="font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace">v2.1</span>
</div>

<div id="main">
  <div id="canvas-wrap"><div id="acciones"></div></div>
  <div id="accSimple"></div>
  <div id="sidebar"></div>
</div>

<script>
/* GradienViz
 *
 * Esta página ilustra el descenso por gradiente en un problema de
 * regresión lineal simple. Pretende simular la manera como una red
 * neuronal aprende a ajustar sus parámetros (pesos y bias) pero
 * sirve para aclarar que aquí son sólo dos parámetros: pendiente y
 * ordenada al origen, mientras que en una red neuronal hay muchos
 * más y se organizan en capas. Por ejemplo, una red simple 2->4->1
 * tiene 12 parámetros en la capa oculta (8 pesos y 4 bias) y 5 en la
 * de salida (4 pesos y 1 bias): 17 en total.
 *
 * Para más detalles, consultar GradienVizMate.tex en el repositorio.
 *
 * UABCS - manc
 * Desarrollado con ayuda de Claude (Anthropic).
 */

 // BLOQUE A — Constantes y paletas de color
// Único disparador de modo: el ANCHO disponible.
// La altura nunca cambia el modo — si la ventana es baja, el scroll resuelve.
const UMBRAL_SIMPLE = 768;   // px

function esModoSimple() {
   return window.innerWidth < UMBRAL_SIMPLE;
}

// Mantiene el CSS sincronizado con la lógica de dibujo: una sola decisión.
function aplicarClaseModo() {
  document.body.classList.toggle('modo-simple', esModoSimple());
}

const VIRIDIS = [
  [68,  1, 84],
  [72, 40,120],
  [62, 83,160],
  [49,104,142],
  [38,130,142],
  [31,158,137],
  [53,183,121],
  [109,205, 89],
  [180,222, 44],
  [253,231, 37],
];

function viridis(t) {
  t = Math.max(0, Math.min(1, t));
  const n = VIRIDIS.length - 1;
  const i = Math.floor(t * n);
  const f = t * n - i;
  if (i >= n) return VIRIDIS[n];
  const a = VIRIDIS[i], b = VIRIDIS[i + 1];
  return [
    Math.round(a[0] + f * (b[0] - a[0])),
    Math.round(a[1] + f * (b[1] - a[1])),
    Math.round(a[2] + f * (b[2] - a[2])),
  ];
}

function convColor(t) {
  // t=0 → verde, t=1 → rojo
  return `hsl(${Math.round(120 - 120 * t)},90%,55%)`;
}

const FS  = 14;  // font size base en px — cambia solo esto para recalibrar
const JITTER_MAX = 0.025;  // desplazamiento máximo en x al perturbar
const D_REF_COLOR = 0.12;  // fracción del rango: distancia que da rojo pleno

// Padding interno de cada panel (px)
const PAD = { l: 52, r: 16, t: 18, b: 26 };

// P2 necesita más margen izquierdo que P1/P3: además de los números del
// eje, aloja las etiquetas rotadas "b" y "b* = ...".
const PAD2 = { l: 72, r: PAD.r, t: PAD.t, b: PAD.b };

// Altura de la banda de botones de acción en la columna izquierda (modo normal)
const ACC_H = 88;

// ═══════════════════════════════════════════════════════════════
// BLOQUE B — Estado global
// ═══════════════════════════════════════════════════════════════

const G = {
  puntos:   [],
  m_star:   0, b_star: 0, J_star: 0,

  m_lo: -0.8, m_hi: 1.8,
  b_lo: -0.6, b_hi: 1.6,

  resolucion:     6,   // resolución compartida: heatmap N×N y trayectorias N×N
  eta:            0.02,
  maxIter:        2000,
  tolerancia:     1e-4,
  dejarRastro:    true,
  trajEnFoco:     0,

  // NUEVO: control de velocidad (iteraciones por frame)
  velocidad:      1,

  estado: 'idle',
  paso:   0,

  trayectorias: [],
  histJ:        [],

  bufHeatmap: null,
  bufCampo:   null,
  bufDirty:   true,

  hoverMB: null,

  puntoDrag:  null,

  condicion: null,

  modoSimpleActual: false,
  prefsNormales:    null,   // respaldo de ajustes al pasar a modo simple
};

// Paneles calculados en setup/resize
const paneles = {
  P1: { ox:0, oy:0, cw:0, ch:0 },
  P2: { ox:0, oy:0, cw:0, ch:0 },
  P3: { ox:0, oy:0, cw:0, ch:0 },
  ACC:{ ox:0, oy:0, cw:0, ch:0 },   // banda de botones (no se dibuja)
};

// ═══════════════════════════════════════════════════════════════
// BLOQUE C — Matemáticas puras
// ═══════════════════════════════════════════════════════════════

function calcRegresion(puntos) 
{
  const n = puntos.length;
  if (n < 3) 
    return null;
  let sx=0, sy=0, sxy=0, sx2=0;
  for (const p of puntos) { 
    sx+=p.x; 
    sy+=p.y; 
    sxy+=p.x*p.y; 
    sx2+=p.x*p.x; 
  }
  const denom = n*sx2 - sx*sx;
  if (Math.abs(denom) < 1e-12) 
    return null;
  const m = (n*sxy - sx*sy) / denom;
  const b = (sy - m*sx) / n;
  let J = 0;
  for (const p of puntos) { 
    const e = p.y - (m*p.x+b); 
    J+=e*e; 
  }
  return { m_star: m, b_star: b, J_star: J/n };
}

function calcRango(m_star, b_star) 
{
  const dm = Math.max(0.8, Math.abs(m_star) * 0.6);
  const db = Math.max(0.6, Math.abs(b_star) * 0.6);
  return { m_lo: m_star-dm, m_hi: m_star+dm, b_lo: b_star-db, b_hi: b_star+db };
}

function calcJ_mb(m, b) 
{
  let J = 0;
  for (const p of G.puntos) { 
    const e = p.y-(m*p.x+b); 
    J+=e*e; 
  }
  return G.puntos.length ? J/G.puntos.length : 0;
}

function dentroDePanel(panel, x, y) 
{
  return x >= panel.ox && x <= panel.ox + panel.cw &&
         y >= panel.oy && y <= panel.oy + panel.ch;
}

// ─── Funciones de mapeo ──────────────────────────────────────

// Panel 1: datos [0,1]² → canvas pixels
function d2c(panel, xd, yd) 
{
  const { ox, oy, cw, ch } = panel;
  return {
    cx: ox + PAD.l + xd * (cw - PAD.l - PAD.r),
    cy: oy + PAD.t + (1 - yd) * (ch - PAD.t - PAD.b),
  };
}

// Panel 2: parámetros → canvas pixels
function p2c(panel, m, b) {
  const { ox, oy, cw, ch } = panel;
  const tm = (m - G.m_lo) / (G.m_hi - G.m_lo);
  const tb = (b - G.b_lo) / (G.b_hi - G.b_lo);
  return {
    cx: ox + PAD2.l + tm * (cw - PAD2.l - PAD2.r),
    cy: oy + PAD2.t + (1 - tb) * (ch - PAD2.t - PAD2.b),
  };
}

// Panel 2: canvas pixels → (m, b), snap al centro de celda de la grilla resolución × resolución
function c2pParams(panel, mx, my) {
  const { ox, oy, cw, ch } = panel;
  const x0 = ox + PAD2.l, y0 = oy + PAD2.t;
  const pw = cw - PAD2.l - PAD2.r, ph = ch - PAD2.t - PAD2.b;
  const tm = constrain((mx - x0) / pw, 0, 1);
  const tb = 1 - constrain((my - y0) / ph, 0, 1);

  const N = G.resolucion;
  const ix = constrain(Math.floor(tm * N), 0, N - 1);
  const iy = constrain(Math.floor(tb * N), 0, N - 1);

  const m = G.m_lo + (ix + 0.5) / N * (G.m_hi - G.m_lo);
  const b = G.b_lo + (iy + 0.5) / N * (G.b_hi - G.b_lo);
  return { m, b };
}

function calcGradiente(m, b)
{
  const n = G.puntos.length;
  let gm = 0, gb = 0;
  for (const p of G.puntos) {
    const r = m*p.x + b - p.y;
    gm += r * p.x;
    gb += r;
  }
  return { gm: 2*gm/n, gb: 2*gb/n };
}

function calcCondicion(puntos) 
{
  if (puntos.length < 2) 
    return null;
  let Sx2 = 0, Sx = 0;
  const n = puntos.length;
  puntos.forEach(({x}) => { Sx2 += x*x; Sx += x; });
  const a = Sx2, b = Sx, d = n;
  const traza  = a + d;
  const det    = a*d - b*b;
  const disc   = Math.sqrt(Math.max(0, (traza/2)**2 - det));
  const lambda1 = traza/2 + disc;
  const lambda2 = traza/2 - disc;
  if (Math.abs(lambda2) < 1e-12) 
    return Infinity;
  return lambda1 / lambda2;
}

// ═══════════════════════════════════════════════════════════════
// BLOQUE D — Lógica de estado
// ═══════════════════════════════════════════════════════════════

function recalcularTodo() {
  const res = calcRegresion(G.puntos);
  if (!res) {
    G.m_star = null;
    G.b_star = null;
    G.J_star = null;
    G.condicion = Infinity;
    G.bufDirty = true;
    limpiarTrayectorias();
    return;
  }
  Object.assign(G, res, calcRango(res.m_star, res.b_star));
  G.condicion = calcCondicion(G.puntos);
  G.bufDirty = true;
  limpiarTrayectorias();
}

// Perturba solo las coordenadas x. El número de condición κ(XᵀX)
// depende únicamente de la varianza de los x_i: det(XᵀX) = n²·Var(x).
// El ruido independiente inyecta varianza (≈ JITTER_MAX²/3) y hace
// caer κ proporcionalmente.
function perturbarPuntos() {
  if (!G.puntos.length) return;
  for (const p of G.puntos) {
    const delta = (Math.random() - 0.5) * 2 * JITTER_MAX;
    p.x = Math.max(0, Math.min(1, p.x + delta));
  }
  recalcularTodo();
}

function limpiarTrayectorias() {
  G.trayectorias = [];
  G.histJ = [];
  G.paso  = 0;
  G.estado = 'idle';
  actualizarEstadoControles();
}

function inicializarTrayectorias() {
  G.trayectorias = [];
  G.histJ = [];
  G.paso  = 0;
  const N = G.resolucion;
  // Mismo centro de celda que usa el heatmap (ver construirHeatmap):
  // m = m_lo + (ix+0.5)/N*(m_hi-m_lo) — así ambos coinciden siempre.
  for (let iy = 0; iy < N; iy++) {
    for (let ix = 0; ix < N; ix++) {
      const m0 = G.m_lo + (ix+0.5)/N * (G.m_hi - G.m_lo);
      const b0 = G.b_lo + (iy+0.5)/N * (G.b_hi - G.b_lo);
      G.trayectorias.push({
        hist: [{m: m0, b: b0, J: calcJ_mb(m0, b0)}],
        conv: false, iterConv: null,
        div:  false,
        colorFinal: null,
      });
    }
  }

}

function asignarColorConvergencia(idx) {
  const tr = G.trayectorias[idx];
  const {m, b} = tr.hist[tr.hist.length - 1];
  // Distancia normalizada: fracción del rango visible en cada eje
  const dm = (m - G.m_star) / (G.m_hi - G.m_lo);
  const db = (b - G.b_star) / (G.b_hi - G.b_lo);
  const d  = Math.sqrt(dm*dm + db*db);
  // Referencia: a 12% del rango visible ya es rojo pleno
  const t  = Math.min(d / D_REF_COLOR, 1);
  tr.colorFinal = convColor(t);
}

function pasoSimulacion() {
  if (G.paso >= G.maxIter) {
    G.estado = 'limite';
    actualizarEstadoControles();
    return;
  }

  for (let i = 0; i < G.trayectorias.length; i++) {
    const tr = G.trayectorias[i];
    if (tr.conv || tr.div) continue;
    const {m, b} = tr.hist[tr.hist.length-1];
    const {gm, gb} = calcGradiente(m, b);
    const m_new = m - G.eta * gm;
    const b_new = b - G.eta * gb;

    if (!isFinite(m_new) || !isFinite(b_new) ||
        Math.abs(m_new - G.m_star) > 3*(G.m_hi-G.m_lo) ||
        Math.abs(b_new - G.b_star) > 3*(G.b_hi-G.b_lo)) {
      tr.div = true;
      continue;
    }

    tr.hist.push({m: m_new, b: b_new, J: calcJ_mb(m_new, b_new)});

    if (Math.sqrt(gm*gm + gb*gb) < G.tolerancia) {
      tr.conv = true;
      tr.iterConv = G.paso;
      asignarColorConvergencia(i);
    }
  }

  const vals = G.trayectorias.map(tr => tr.hist[tr.hist.length-1].J);
  const media = vals.reduce((a,v)=>a+v,0) / vals.length;
  const desv  = Math.sqrt(vals.reduce((a,v)=>a+(v-media)**2,0) / vals.length);
  G.histJ.push({iter: G.paso, media, desv});
  G.paso++;

  if (G.trayectorias.every(tr => tr.conv || tr.div)) {
    G.estado = 'convergido'; actualizarEstadoControles();
  } else if (G.paso >= G.maxIter) {
    G.estado = 'limite';
    for (const tr of G.trayectorias) {
      if (!tr.conv && !tr.div) tr.colorFinal = 'rgba(180,180,180,0.7)';
    }
    actualizarEstadoControles();
  }
}

// NUEVO: avanzar N pasos manualmente (desde idle o detenido)
function avanzarPasos(n) {
  if (G.puntos.length < 3) return;
  // Si no hay trayectorias activas, inicializarlas
  if (!G.trayectorias.length || G.estado === 'idle') {
    inicializarTrayectorias();
    G.estado = 'detenido';
    actualizarEstadoControles();
  }
  if (G.estado === 'convergido' || G.estado === 'limite') return;

  for (let i = 0; i < n; i++) {
    pasoSimulacion();
    if (G.estado === 'convergido' || G.estado === 'limite') break;
  }
}

// ═══════════════════════════════════════════════════════════════
// BLOQUE E — Renderizado
// ═══════════════════════════════════════════════════════════════

function formatearNum(v) {
  return Math.abs(v)>=100 ? v.toFixed(0)
       : Math.abs(v)>=10  ? v.toFixed(1)
                           : v.toFixed(2);
}

function dibujarPanel(panel, titulo, bgR, bgG, bgB, brR, brG, brB) {
  const { ox, oy, cw, ch } = panel;
  fill(bgR, bgG, bgB);
  stroke(brR, brG, brB);
  strokeWeight(1.5);
  rect(ox, oy, cw, ch, 3);

  noStroke();
  fill(160, 160, 180, 160);
  textFont('IBM Plex Mono, monospace');
  textSize(FS * 1.2);
  textAlign(LEFT, CENTER);
  text(titulo, ox + PAD.l, oy + PAD.t / 2);
}

function dibujarEjes(panel, xLo, xHi, yLo, yHi, nTicks, pad = PAD) {
  const { ox, oy, cw, ch } = panel;
  const x0 = ox+pad.l, y0 = oy+pad.t;
  const pw  = cw-pad.l-pad.r, ph = ch-pad.t-pad.b;

  stroke(100,100,110); strokeWeight(1.5);
  line(x0, y0,    x0,    y0+ph);
  line(x0, y0+ph, x0+pw, y0+ph);

  textFont('IBM Plex Mono, monospace');
  textSize(FS);

  for (let i=0; i<nTicks; i++) {
    const t  = i/(nTicks-1);

    const vx = xLo + t*(xHi-xLo);
    const cx = x0 + t*pw;
    stroke(100,100,110); strokeWeight(1);
    line(cx, y0+ph, cx, y0+ph+4);
    noStroke(); fill(130,130,145);
    textAlign(CENTER, TOP);
    text(formatearNum(vx), cx, y0+ph+6);

    const vy = yLo + t*(yHi-yLo);
    const cy = y0 + (1-t)*ph;
    stroke(100,100,110); strokeWeight(1);
    line(x0-4, cy, x0, cy);
    noStroke(); fill(130,130,145);
    textAlign(RIGHT, CENTER);
    text(formatearNum(vy), x0-6, cy);
  }
}

function dibujarGridP1(panel) {
  const { ox, oy, cw, ch } = panel;
  const x0 = ox+PAD.l, y0 = oy+PAD.t;
  const pw = cw-PAD.l-PAD.r, ph = ch-PAD.t-PAD.b;
  stroke(195,195,200); strokeWeight(0.5);
  drawingContext.setLineDash([2, 4]);
  for (let i=1; i<=4; i++) {
    const t = i/5;
    line(x0 + t*pw,  y0,          x0 + t*pw,  y0+ph);
    line(x0,         y0+(1-t)*ph, x0+pw,      y0+(1-t)*ph);
  }
  drawingContext.setLineDash([]);
}

function dibujarRectaRegresion(panel) {

  const {cx:x1,cy:y1} = d2c(panel, 1, G.m_star+G.b_star);

function dibujarPuntosP1(panel) {

function dibujarPanel1() {
  const p = paneles.P1;

  dibujarPuntosP1(p);

  // Coordenadas en esquina superior derecha del padding del título.

  noStroke(); fill(122,122,154);
  textFont('IBM Plex Mono, monospace');
  textSize(FS - 1);
  textAlign(RIGHT, CENTER);
  if (!hayEspacioCoords) {
    /* sin espacio: no se dibujan */
  } else if (G.puntoDrag !== null) {
    const {x, y} = G.puntos[G.puntoDrag];
    text('x=' + x.toFixed(3) + '  y=' + y.toFixed(3),
      p.ox + p.cw - PAD.r, p.oy + PAD.t / 2);
  } else if (dentroDePanel(p, mouseX, mouseY)) {
    const {xd, yd} = canvasToData(mouseX, mouseY, p);
    text('x=' + xd.toFixed(3) + '  y=' + yd.toFixed(3),
      p.ox + p.cw - PAD.r, p.oy + PAD.t / 2);
  }

  const nPts = G.puntos.length;
  const yTexto = p.oy + PAD.t + (p.ch - PAD.t - PAD.b) - 8;
  if (nPts < 3) {
    noStroke(); fill(130,130,148);
    textFont('IBM Plex Mono, monospace');
    textSize(FS - 1);
    textAlign(LEFT, BOTTOM);
    text(`${nPts}/20 pts  (mín. 3 para entrenar)`, p.ox + PAD.l + 4, yTexto);
  } else if (G.m_star === null) {
    noStroke(); fill(130,130,148);
    textFont('IBM Plex Mono, monospace');
    textSize(FS - 1);
    textAlign(LEFT, BOTTOM);
    text('sistema singular — x constante', p.ox + PAD.l + 4, yTexto);
  } else {
    if (G.condicion !== null) {
      const k = G.condicion;
      let kStr;
      if (k === Infinity || k > 1e6) {
        const exp  = Math.floor(Math.log10(k));
        const mant = k / Math.pow(10, exp);
        const sup  = String(exp).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
        kStr = `κ = ${mant.toFixed(1)}×10${sup}  ⚠ mal condicionado`;
        fill(249,115,22);
      } else if (k > 1000) {
        kStr = `κ = ${k.toFixed(1)}  ⚠ mal condicionado`;
        fill(249,115,22);
      } else if (k > 100) {
        kStr = `κ = ${k.toFixed(1)}`;
        fill(251,191,36);
      } else {
        kStr = `κ = ${k.toFixed(1)}`;
        fill(122,122,154);
      }
      noStroke();
      textFont('IBM Plex Mono, monospace');
      textSize(FS - 1);
      textAlign(RIGHT, TOP);
      text(kStr, p.ox + p.cw - PAD.r, p.oy + PAD.t + 4);
    }
  }
}

// ── Panel 2 ──────────────────────────────────────────────────

function construirHeatmap() {
  if (G.m_star === null) return;
  const N = G.resolucion;
  const celdas = [];
  let Jmin=Infinity, Jmax=-Infinity;
  for (let iy=0; iy<N; iy++) {
    for (let ix=0; ix<N; ix++) {
      const m = G.m_lo + (ix+0.5)/N*(G.m_hi-G.m_lo);
      const b = G.b_lo + (iy+0.5)/N*(G.b_hi-G.b_lo);
      const J = calcJ_mb(m, b);
      celdas.push({J});
      Jmin=Math.min(Jmin,J); Jmax=Math.max(Jmax,J);
    }
  }
  const rng = Jmax-Jmin+1e-12;
  for (const c of celdas) {
    const t = (c.J - Jmin) / rng;              // t ∈ [0,1]
    const tLog = Math.log(1 + 9*t) / Math.log(10);  // comprime el rango alto
    c.col = viridis(tLog);
  }
  G.bufHeatmap = celdas;
  G.bufDirty   = false;
}

function dibujarHeatmap(panel) {
  const N  = G.resolucion;
  const x0 = panel.ox+PAD2.l, y0 = panel.oy+PAD2.t;
  const pw = panel.cw-PAD2.l-PAD2.r, ph = panel.ch-PAD2.t-PAD2.b;
  const cw = pw/N, ch = ph/N;
  noStroke();
  for (let iy=0; iy<N; iy++) {
    for (let ix=0; ix<N; ix++) {
      const [r,g,b] = G.bufHeatmap[iy*N+ix].col;
      fill(r,g,b);
      rect(x0+ix*cw, y0+(N-1-iy)*ch, cw+1, ch+1);
    }
  }
}

function dibujarPuntoOptimo_P2(panel) {
  if (G.puntos.length < 3) return;
  if (G.m_star === null) return;
  const {cx,cy} = p2c(panel, G.m_star, G.b_star);
  stroke(251,191,36); strokeWeight(2); noFill();
  const r=7;
  line(cx-r,cy,cx+r,cy); line(cx,cy-r,cx,cy+r);
  ellipse(cx,cy,r*2.5,r*2.5);
}

function dibujarTrayectorias(panel) {
  for (let i = 0; i < G.trayectorias.length; i++) {
    const tr = G.trayectorias[i];
    if (tr.hist.length < 2) continue;
    const esFoco = (i === G.trajEnFoco);

    let col;
    if      (tr.div)  col = 'rgba(239,68,68,0.5)';
    else if (tr.conv) col = tr.colorFinal;
    else              col = esFoco ? '#fb923c' : 'rgba(255,255,255,0.55)';

    stroke(col); strokeWeight(esFoco ? 3 : 1.5); noFill();

    if (G.dejarRastro) {
      // Se dibuja 1 de cada 2 puntos del historial: el ojo no distingue la
      // diferencia de trazo, pero el costo de dibujo (dominante con rastro
      // largo) se reduce a la mitad. El historial completo se conserva
      // intacto para el cálculo del gradiente — solo se diezma el dibujo.
      beginShape();
      const h = tr.hist;
      for (let k = 0; k < h.length; k += 2) {
        const {cx, cy} = p2c(panel, h[k].m, h[k].b);
        vertex(cx, cy);
      }
      // Asegura que el último punto real siempre se incluya, aunque su
      // índice no sea par — si no, el trazo podría quedarse corto.
      if ((h.length - 1) % 2 !== 0) {
        const last = h[h.length - 1];
        const {cx, cy} = p2c(panel, last.m, last.b);
        vertex(cx, cy);
      }
      endShape();
    } else if (tr.hist.length >= 2) {
      const a = p2c(panel, tr.hist[tr.hist.length-2].m, tr.hist[tr.hist.length-2].b);
      const z = p2c(panel, tr.hist[tr.hist.length-1].m, tr.hist[tr.hist.length-1].b);
      line(a.cx, a.cy, z.cx, z.cy);
    }

    const fin = tr.hist[tr.hist.length-1];
    const {cx, cy} = p2c(panel, fin.m, fin.b);
    fill(col); noStroke();
    ellipse(cx, cy, esFoco ? 8 : 5, esFoco ? 8 : 5);
  }
}

function dibujarRecta(panel, m, b, color, weight) {
  const {cx:x0, cy:y0} = d2c(panel, 0, b);
  const {cx:x1, cy:y1} = d2c(panel, 1, m+b);
  stroke(color); strokeWeight(weight);
  line(x0, y0, x1, y1);
}

function dibujarRectaFoco(panel) {
  if (!G.trayectorias.length) return;
  const tr = G.trayectorias[G.trajEnFoco];
  if (!tr || !tr.hist.length) return;
  const {m, b} = tr.hist[tr.hist.length-1];
  dibujarRecta(panel, m, b, 'rgba(251,146,60,1)', 2);
}

// Nombres de los ejes del espacio de parámetros: m abajo, b a la izquierda.
function dibujarEtiquetasEjesP2(panel) {
  const x0 = panel.ox + PAD2.l, y0 = panel.oy + PAD2.t;
  const pw = panel.cw - PAD2.l - PAD2.r, ph = panel.ch - PAD2.t - PAD2.b;

  noStroke();
  fill(160, 160, 185);
  textFont('IBM Plex Mono, monospace');
  textSize(FS * 1.15);

  textAlign(CENTER, TOP);
  text('m', x0 + pw / 2, y0 + ph + 24);

  push();
  translate(panel.ox + 16, y0 + ph / 2);
  rotate(-HALF_PI);
  textAlign(CENTER, CENTER);
  text('b', 0, 0);
  pop();

  // m* y b* DENTRO del área de color, en la posición real del óptimo
  // (no en el margen exterior) — mismo color que la marca ⊕.
  if (G.m_star === null) return;
  fill(251, 191, 36);
  textSize(FS);

  const {cx: mx} = p2c(panel, G.m_star, G.b_lo);
  const {cy: by} = p2c(panel, G.m_lo,   G.b_star);

  // m*: pegada al borde inferior del área de color, centrada en su x real.
  textAlign(CENTER, BOTTOM);
  text(`m* = ${G.m_star.toFixed(3)}`, mx, y0 + ph - 4);

  // b*: dentro del área de color, separada de la etiqueta "b" del eje
  // (que vive justo al otro lado del borde, en el margen).
  push();
  translate(x0 + 22, by);
  rotate(-HALF_PI);
  textAlign(CENTER, BOTTOM);
  text(`b* = ${G.b_star.toFixed(3)}`, 0, -4);
  pop();

  noStroke(); fill(251, 191, 36);
  textAlign(LEFT, TOP);
  text(`MSE = ${G.J_star.toFixed(4)}`, x0 + 4, y0 + 4);
}

function dibujarPanel2() {
  const p2 = paneles.P2;
  dibujarPanel(p2, 'Espacio (m, b)', 17,17,17, 51,51,51);
  if (G.puntos.length >= 3 && G.m_star !== null) {
    if (G.bufDirty || !G.bufHeatmap) construirHeatmap();
    dibujarHeatmap(p2);
  }
  dibujarEjes(p2, G.m_lo, G.m_hi, G.b_lo, G.b_hi, 5, PAD2);
  dibujarEtiquetasEjesP2(p2);
  dibujarTrayectorias(p2);
  dibujarPuntoOptimo_P2(p2);

  const nConv = G.trayectorias.filter(tr => tr.conv).length;
  const nTot  = G.trayectorias.length;
  if (nTot > 0) {
    noStroke(); fill(122,122,154);
    textFont('IBM Plex Mono, monospace');
    textSize(FS - 1);
    textAlign(RIGHT, TOP);
    text(`iter ${G.paso} / ${G.maxIter}`,
         p2.ox + p2.cw - PAD.r, p2.oy + PAD.t + 4);
    text(`conv. ${nConv} / ${nTot}`,
         p2.ox + p2.cw - PAD.r, p2.oy + PAD.t + 4 + FS + 2);
  }

  // Indicador de estado en el footer
  let estadoTexto = null;
  let estadoR, estadoG, estadoB;
  if      (G.estado === 'animando')   { estadoTexto = 'Entrenando…';         estadoR=96;  estadoG=165; estadoB=250; }
  else if (G.estado === 'convergido') { estadoTexto = 'Convergido ✓';        estadoR=34;  estadoG=197; estadoB=94;  }
  else if (G.estado === 'limite')     { estadoTexto = 'Límite — no convergió'; estadoR=249; estadoG=115; estadoB=22;  }
  else if (G.estado === 'detenido')   { estadoTexto = 'Detenido';            estadoR=122; estadoG=122; estadoB=154; }
  if (estadoTexto) {
    noStroke(); fill(estadoR, estadoG, estadoB);
    textFont('IBM Plex Mono, monospace');
    textSize(FS);
    textAlign(RIGHT, BOTTOM);
    text(estadoTexto,
         p2.ox + PAD2.l + (p2.cw - PAD2.l - PAD2.r) - 4,
         p2.oy + PAD2.t + (p2.ch - PAD2.t - PAD2.b) - 4 - FS - 4);
  }
}

// ── Panel 3 ──────────────────────────────────────────────────

function dibujarPanel3() {
  const panel = paneles.P3;
  dibujarPanel(panel, 'J(t)', 17,17,17, 51,51,51);

  if (G.histJ.length < 2) {
    noStroke(); fill(100,100,120); textSize(FS); textAlign(CENTER,CENTER);
    text('sin datos aún', panel.ox+panel.cw/2, panel.oy+panel.ch/2);
    return;
  }

  const { ox, oy, cw, ch } = panel;
  const x0 = ox+PAD.l, y0 = oy+PAD.t;
  const pw = cw-PAD.l-PAD.r, ph = ch-PAD.t-PAD.b;
  const n  = G.histJ.length;

  const jMin = G.J_star * 0.9;
  const jMax = G.histJ[0].media * 1.1;
  const toX  = i => x0 + (i / Math.max(n-1, 1)) * pw;
  const toY  = j => y0 + (1 - constrain((j-jMin)/(jMax-jMin), 0, 1)) * ph;

  dibujarEjes(panel, 0, n-1, jMin, jMax, 3);

  // J* punteada amarilla
  drawingContext.setLineDash([4, 4]);
  stroke(251,191,36); strokeWeight(1);
  line(x0, toY(G.J_star), x0+pw, toY(G.J_star));
  drawingContext.setLineDash([]);

  // Banda ±σ
  noStroke(); fill(96,165,250, 40);
  beginShape();
  for (let i=0; i<n; i++) vertex(toX(i), toY(G.histJ[i].media + G.histJ[i].desv));
  for (let i=n-1; i>=0; i--) vertex(toX(i), toY(G.histJ[i].media - G.histJ[i].desv));
  endShape(CLOSE);

  // Línea J_media
  stroke(96,165,250); strokeWeight(2); noFill();
  beginShape();
  for (let i=0; i<n; i++) vertex(toX(i), toY(G.histJ[i].media));
  endShape();

  // Punto naranja en iteración actual
  const last = G.histJ[n-1];
  fill(251,146,60); noStroke();
  ellipse(toX(n-1), toY(last.media), 7, 7);
}

function dibujarMiniJT() {
  const dpr = window.devicePixelRatio || 1;
  const wCss = elMiniJT.clientWidth;
  const wPix = Math.round(wCss * dpr);
  const hPix = Math.round(48 * dpr);
  if (elMiniJT.width !== wPix || elMiniJT.height !== hPix) {
    elMiniJT.width = wPix;
    elMiniJT.height = hPix;
    ctxMiniJT.setTransform(1, 0, 0, 1, 0, 0);
    ctxMiniJT.scale(dpr, dpr);
  }

  const w = wCss, h = 48;
  ctxMiniJT.clearRect(0, 0, w, h);

  if (elMiniJTVal) {
    elMiniJTVal.textContent = G.histJ.length
      ? G.histJ[G.histJ.length - 1].media.toFixed(4)
      : '—';
  }

  if (wCss < 1) return;
  if (G.histJ.length < 2) return;

  const n = G.histJ.length;
  const jMin = G.J_star * 0.9;
  const jMax = G.histJ[0].media * 1.1;
  const toX = i => (i / (n - 1)) * w;
  const toY = j => h - constrain((j - jMin) / (jMax - jMin), 0, 1) * h;

  ctxMiniJT.strokeStyle = '#60a5fa';
  ctxMiniJT.lineWidth = 1.5;
  ctxMiniJT.beginPath();
  for (let i = 0; i < n; i++) {
    const x = toX(i), y = toY(G.histJ[i].media);
    if (i === 0) ctxMiniJT.moveTo(x, y); else ctxMiniJT.lineTo(x, y);
  }
  ctxMiniJT.stroke();

  const last = G.histJ[n - 1];
  ctxMiniJT.fillStyle = '#60a5fa';
  ctxMiniJT.beginPath();
  ctxMiniJT.arc(toX(n - 1), toY(last.media), 2.5, 0, Math.PI * 2);
  ctxMiniJT.fill();
}

const RES_VALUES = [4, 6, 8];   // heatmap y trayectorias comparten resolución
const SPEED_VALUES = [1, 2, 5, 10, 20, 50, 100]; // NUEVO

let elBtnTrain, elBtnReset, elBtnPuntos, elBtnPerturbar, elBtnBorrar;
let elBtnStep1, elBtnStep10, elBtnStep50; // NUEVO
let elSliderRes, elSliderEta, elSliderSpeed;
let elCheckRastro, elInputFoco;
let elValRes, elValEta, elValSpeed;
let elMiniJT, ctxMiniJT, elMiniJTVal;

function crearControles() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  elBtnTrain = elBtnReset = elBtnPuntos = elBtnPerturbar = elBtnBorrar = null;
  elBtnStep1 = elBtnStep10 = elBtnStep50 = null;
  elSliderRes = elSliderEta = elSliderSpeed = null;
  elCheckRastro = elInputFoco = null;
  elValRes = elValEta = elValSpeed = null;
  elMiniJT = ctxMiniJT = elMiniJTVal = null;

  const simple = esModoSimple();
  if (simple) {
    // El modo simple impone valores fijos; se preservan los del usuario
    // para no perderlos al volver a modo normal.
    if (!G.prefsNormales) {
      G.prefsNormales = {
        resolucion: G.resolucion,
        velocidad:  G.velocidad,
      };
    }
    G.resolucion = 4;
    G.velocidad  = 5;
    G.trajEnFoco = Math.min(G.trajEnFoco, 15);
    G.bufDirty   = true;
  } else if (G.prefsNormales) {
    Object.assign(G, G.prefsNormales);
    G.prefsNormales = null;
    G.trajEnFoco = Math.min(G.trajEnFoco, G.resolucion * G.resolucion - 1);
    G.bufDirty = true;
  }

  // ── Datos ────────────────────────────────────────────────
  const secDatos = mkSection('Datos');
  elBtnPuntos = mkBtn('Puntos aleatorios', '', () => {
    const nPts = 5 + Math.floor(Math.random() * 11);  // 5 a 15
    G.puntos = Array.from({length:nPts}, () => ({x:Math.random(), y:Math.random()}));
    recalcularTodo();
  });
  secDatos.appendChild(elBtnPuntos);

  if (simple) {
    elBtnBorrar = mkBtn('Borrar todo', 'btn-danger', () => {
      G.puntos = [];
      recalcularTodo();
    });
    secDatos.appendChild(elBtnBorrar);
  } else {
    elBtnPerturbar = mkBtn('Perturbar', '', perturbarPuntos);
    secDatos.appendChild(elBtnPerturbar);
  }
  // En modo simple, Datos se usa con poca frecuencia (una vez por
  // "experimento") frente a Entrenar/Reiniciar, así que se agrega al
  // sidebar al final, después de Modelo y Visualización (ver más abajo).
  // En modo ancho conserva su posición original: primera sección.
  if (!simple) sb.appendChild(secDatos);

  // ── Modelo ───────────────────────────────────────────────
  const secModelo = mkSection('Modelo');

  if (!simple) {
    // Resolución compartida: gobierna heatmap N×N y trayectorias N×N a la
    // vez (una trayectoria nace en el centro de cada celda del heatmap).
    [elSliderRes, elValRes] = mkSlider(
      secModelo, 'Resolución', 0, RES_VALUES.length-1, RES_VALUES.indexOf(G.resolucion),
      v => {
        G.resolucion = RES_VALUES[v];
        const maxIdx = G.resolucion * G.resolucion - 1;
        elInputFoco.max = maxIdx;
        if (G.trajEnFoco > maxIdx) {
          G.trajEnFoco = maxIdx;
          elInputFoco.value = maxIdx;
        }
        limpiarTrayectorias();
        G.bufDirty = true;
        return G.resolucion;
      }
    );
  }

  // eta (logarítmico)
  [elSliderEta, elValEta] = mkSlider(
    secModelo, 'η (lr)', 0, 100, etaToSlider(G.eta),
    v => { G.eta = sliderToEta(v); limpiarTrayectorias(); return G.eta.toFixed(3); }
  );

  sb.appendChild(secModelo);

  // ── Visualización ────────────────────────────────────────
  const secVis = mkSection('Visualización');

  const rowRastro = document.createElement('div');
  rowRastro.className = 'ctrl-inline';
  const lblRastro = document.createElement('label');
  elCheckRastro = document.createElement('input');
  elCheckRastro.type = 'checkbox';
  elCheckRastro.checked = G.dejarRastro;
  elCheckRastro.addEventListener('change', () => { G.dejarRastro = elCheckRastro.checked; });
  lblRastro.appendChild(elCheckRastro);
  lblRastro.appendChild(document.createTextNode('Dejar rastro'));
  rowRastro.appendChild(lblRastro);
  secVis.appendChild(rowRastro);

  const rowFoco = document.createElement('div');
  rowFoco.className = 'ctrl-inline';
  const lblFoco = document.createElement('label');
  lblFoco.textContent = 'Foco tray.';
  lblFoco.style.color = 'var(--text-dim)';
  lblFoco.style.fontSize = '11px';
  elInputFoco = document.createElement('input');
  elInputFoco.type  = 'number';
  elInputFoco.min   = 0;
  elInputFoco.max   = G.resolucion * G.resolucion - 1;
  elInputFoco.value = G.trajEnFoco;
  elInputFoco.addEventListener('change', () => {
    const maxIdx = +elInputFoco.max;
    G.trajEnFoco = Math.max(0, Math.min(maxIdx, +elInputFoco.value));
    elInputFoco.value = G.trajEnFoco;
  });
  rowFoco.appendChild(lblFoco);
  rowFoco.appendChild(elInputFoco);
  secVis.appendChild(rowFoco);

  sb.appendChild(secVis);

  // En modo simple, Datos va después de Modelo y Visualización (ver
  // arriba: en modo ancho ya se agregó en su posición original).
  if (simple) sb.appendChild(secDatos);

  // NUEVO: ── Velocidad ────────────────────────────────────
  if (!simple) {
    const secVel = mkSection('Velocidad');
    [elSliderSpeed, elValSpeed] = mkSlider(
      secVel, 'Speed', 0, SPEED_VALUES.length-1, SPEED_VALUES.indexOf(G.velocidad),
      v => { G.velocidad = SPEED_VALUES[v]; return G.velocidad + '×'; }
    );
    // El slider de velocidad NUNCA se deshabilita (se puede cambiar en caliente)
    sb.appendChild(secVel);
  }

  // ── J(t) miniatura + Acciones (solo modo simple) ──────────
  // Ambos viven en #accSimple, la fila de acceso rápido que queda
  // inmediatamente debajo del heatmap: J(t) a la izquierda,
  // Entrenar/Reiniciar apilados a la derecha. Así el usuario no
  // necesita hacer scroll para ver el progreso ni para actuar.
  const elAccSimple = document.getElementById('accSimple');
  elAccSimple.innerHTML = '';

  if (simple) {
    const colJT = document.createElement('div');
    colJT.className = 'accSimple-jt';

    const rowLbl = document.createElement('div');
    rowLbl.className = 'ctrl-label';
    const spanJ = document.createElement('span');
    spanJ.textContent = 'J(t)';
    const spanVal = document.createElement('span');
    spanVal.className = 'val';
    elMiniJTVal = spanVal;
    rowLbl.appendChild(spanJ);
    rowLbl.appendChild(spanVal);
    colJT.appendChild(rowLbl);

    elMiniJT = document.createElement('canvas');
    elMiniJT.style.width = '100%';
    elMiniJT.style.height = '48px';
    elMiniJT.style.background = 'transparent';
    colJT.appendChild(elMiniJT);

    elAccSimple.appendChild(colJT);

    ctxMiniJT = elMiniJT.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    elMiniJT.width  = Math.round(elMiniJT.clientWidth * dpr);
    elMiniJT.height = Math.round(48 * dpr);
    ctxMiniJT.scale(dpr, dpr);
  }

  // ── Acciones ─────────────────────────────────────────────
  // Modo normal: en la banda sobre el canvas, bajo el panel de datos.
  // Modo simple: en #accSimple, junto a J(t) (ver arriba).
  const elAcc = document.getElementById('acciones');
  elAcc.innerHTML = '';

  elBtnTrain = mkBtn('Entrenar', 'btn-primary', () => {
    if (G.estado === 'animando') {
      G.estado = 'detenido';
      actualizarEstadoControles();
      return;
    }
    if (G.puntos.length < 3) return;
    inicializarTrayectorias();
    G.estado = 'animando';
    actualizarEstadoControles();
  });

  elBtnReset = mkBtn('Reiniciar', 'btn-danger', () => {
    limpiarTrayectorias();
    G.bufDirty = true;
  });

  if (simple) {
    const colBotones = document.createElement('div');
    colBotones.className = 'accSimple-botones';
    colBotones.appendChild(elBtnTrain);
    colBotones.appendChild(elBtnReset);
    elAccSimple.appendChild(colBotones);
  } else {
    const fila1 = document.createElement('div');
    fila1.className = 'btn-group';
    elBtnTrain.style.flex = '2';
    fila1.appendChild(elBtnTrain);
    fila1.appendChild(elBtnReset);

    const fila2 = document.createElement('div');
    fila2.className = 'btn-group';
    elBtnStep1  = mkBtn('+1',  '', () => avanzarPasos(1));
    elBtnStep10 = mkBtn('+10', '', () => avanzarPasos(10));
    elBtnStep50 = mkBtn('+50', '', () => avanzarPasos(50));
    fila2.appendChild(elBtnStep1);
    fila2.appendChild(elBtnStep10);
    fila2.appendChild(elBtnStep50);

    elAcc.appendChild(fila1);
    elAcc.appendChild(fila2);
  }

  actualizarEstadoControles();
}

function actualizarEstadoControles() {
  if (!elBtnTrain) return;
  const anim = G.estado === 'animando';
  elBtnPuntos.disabled  = anim;
  if (elBtnPerturbar) elBtnPerturbar.disabled = anim;
  if (elBtnBorrar)    elBtnBorrar.disabled = anim;
  if (elSliderRes)    elSliderRes.disabled  = anim;
  elSliderEta.disabled  = anim;
  // NUEVO: speed siempre habilitado; step buttons habilitados cuando NO animando
  const puedeStep = !anim;
  if (elBtnStep1)  elBtnStep1.disabled  = !puedeStep;
  if (elBtnStep10) elBtnStep10.disabled = !puedeStep;
  if (elBtnStep50) elBtnStep50.disabled = !puedeStep;

  elBtnTrain.textContent = anim ? 'Detener' : 'Entrenar';
  elBtnTrain.className   = 'btn ' + (anim ? 'btn-danger' : 'btn-primary');
  elBtnReset.disabled    = G.estado === 'idle';
}

// ─── Helpers UI ──────────────────────────────────────────────

function mkSection(titulo) {
  const sec = document.createElement('div');
  sec.className = 'ctrl-section';
  if (titulo) {
    const h = document.createElement('div');
    h.className = 'ctrl-section-title';
    h.textContent = titulo;
    sec.appendChild(h);
  }
  return sec;
}

function mkBtn(label, cls, fn) {
  const b = document.createElement('button');
  b.className = 'btn' + (cls ? ' ' + cls : '');
  b.textContent = label;
  b.addEventListener('click', fn);
  return b;
}

// Returns [sliderEl, valEl]
function mkSlider(parent, label, min, max, val, onChange) {
  const row = document.createElement('div');
  row.className = 'ctrl-row';

  const lbl = document.createElement('div');
  lbl.className = 'ctrl-label';
  const span = document.createElement('span');
  span.textContent = label;
  const valEl = document.createElement('span');
  valEl.className = 'val';
  // Display initial value via onChange which returns formatted value
  valEl.textContent = (() => {
    // peek at initial value without side-effects
    if (label === 'Resolución')    return G.resolucion;
    if (label === 'η (lr)')        return G.eta.toFixed(3);
    if (label === 'Speed')         return G.velocidad + '×';
    return val;
  })();
  lbl.appendChild(span);
  lbl.appendChild(valEl);

  const slider = document.createElement('input');
  slider.type  = 'range';
  slider.min   = min;
  slider.max   = max;
  slider.step  = 1;
  slider.value = val;
  slider.addEventListener('input', () => {
    valEl.textContent = onChange(+slider.value);
  });

  row.appendChild(lbl);
  row.appendChild(slider);
  parent.appendChild(row);
  return [slider, valEl];
}

function etaToSlider(eta) {
  return Math.round(100 * Math.log(eta / 0.001) / Math.log(500));
}
function sliderToEta(s) {
  return 0.001 * Math.pow(500, s / 100);
}

// ═══════════════════════════════════════════════════════════════
// BLOQUE G — setup() / draw() / eventos p5.js (modo global)
// ═══════════════════════════════════════════════════════════════

// Ancho de la columna izquierda (P1 / acciones / P3) en modo normal.
// Se elige para que el área interior de P2 quede lo más cuadrada posible:
// así las celdas del heatmap no se deforman y su aspecto es comparable
// al del espacio de datos.
function calcColIzq(W, H) {
  let s2 = Math.min(H - PAD.t - PAD.b, Math.floor(W * 0.68) - PAD.l - PAD.r);
  s2 = Math.max(s2, 160);
  // En canvas angostos un mínimo fijo aplastaría a P2: se relaja con el ancho.
  const colMax = Math.floor(W * 0.42);
  const colMin = Math.min(280, colMax);
  return Math.max(colMin, Math.min(colMax, W - (s2 + PAD.l + PAD.r)));
}

function calcularPaneles() {
  const W = width;
  const H = height;

  if (esModoSimple()) {
    // Siempre apilado vertical: P1 arriba, P2 abajo. El scroll resuelve el alto.
    paneles.P3  = null;
    paneles.ACC = null;
    const mitad = Math.floor(H / 2);
    paneles.P1 = { ox: 0, oy: 0,     cw: W, ch: mitad };
    paneles.P2 = { ox: 0, oy: mitad, cw: W, ch: H - mitad };
    return;
  }

  // ── Modo normal ──────────────────────────────────────────────
  const colIzq = calcColIzq(W, H);
  paneles.P2 = { ox: colIzq, oy: 0, cw: W - colIzq, ch: H };

  // Columna izquierda: P1 (interior lo más cuadrado posible), banda de
  // acciones, y P3 con el resto.
  // P1 quiere ser cuadrado; J(t) se acota entre 190 y 320 px y el sobrante
  // vuelve a P1, para que ninguno de los dos se deforme sin necesidad.
  const p1hCuad = (colIzq - PAD.l - PAD.r) + PAD.t + PAD.b;
  let p3h = Math.max(190, Math.min(320, H - ACC_H - p1hCuad));
  let p1h = H - ACC_H - p3h;
  if (p1h < 180) { p1h = 180; p3h = H - ACC_H - p1h; }

  paneles.P1  = { ox: 0, oy: 0,            cw: colIzq, ch: p1h  };
  paneles.ACC = { ox: 0, oy: p1h,          cw: colIzq, ch: ACC_H };
  paneles.P3  = { ox: 0, oy: p1h + ACC_H,  cw: colIzq, ch: p3h  };
}

// Coloca el div de botones sobre la banda reservada del canvas.
// Los botones no tienen ejes que dibujar, así que ocupan el ancho PLENO
// de la columna (igual que el contorno de P1/P3) — no el PAD.l/PAD.r que
// esos paneles reservan para sus etiquetas de eje vertical.
const MARGEN_ACC = 4;
function posicionarAcciones() {
  const el = document.getElementById('acciones');
  if (!el) return;
  if (!paneles.ACC || esModoSimple()) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.style.left  = (paneles.ACC.ox + MARGEN_ACC) + 'px';
  el.style.top   = (paneles.ACC.oy + 6) + 'px';
  el.style.width = (paneles.ACC.cw - 2 * MARGEN_ACC) + 'px';
}

// Altura natural del sidebar: techo de altura para el canvas en modo normal,
// para que ambas columnas se vean a la par (idea del autor). Si la ventana
// es más baja que este valor, el min-height de #main y el scroll resuelven;
// esto nunca depende de innerHeight, solo del contenido real del sidebar.
function alturaSidebar() {
  const sb = document.getElementById('sidebar');
  return sb ? sb.getBoundingClientRect().height : 0;
}

function dimensionesCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth;
  if (!esModoSimple()) {
    const techo = alturaSidebar();
    const h = techo > 0 ? Math.min(wrap.clientHeight, techo) : wrap.clientHeight;
    return { w, h };
  }
  // Modo simple: dos paneles apilados, cada uno con interior cuadrado.
  // La altura sale del ancho; el alto de la ventana no interviene.
  const altoPanel = (w - PAD.l - PAD.r) + PAD.t + PAD.b;
  return { w, h: 2 * altoPanel };
}

function setup() {
  aplicarClaseModo();
  G.modoSimpleActual = esModoSimple();
  crearControles();            // el sidebar debe existir antes de medirlo
  const { w, h } = dimensionesCanvas();
  const cnv = createCanvas(w, h);
  cnv.parent('canvas-wrap');
  calcularPaneles();
  posicionarAcciones();
  frameRate(60);
}

function draw() {
  background(15, 15, 19);
  if (G.estado === 'animando') {
    // NUEVO: respetar velocidad (iteraciones por frame)
    for (let i = 0; i < G.velocidad; i++) {
      pasoSimulacion();
      if (G.estado !== 'animando') break;
    }
  }
  dibujarPanel1();
  dibujarPanel2();
  if (paneles.P3) dibujarPanel3();
  if (ctxMiniJT) dibujarMiniJT();
}

function windowResized() {
  const nuevo  = esModoSimple();
  const cambio = nuevo !== G.modoSimpleActual;

  // La clase debe aplicarse ANTES de medir el wrap: el CSS depende de ella.
  aplicarClaseModo();

  if (cambio) {
    G.modoSimpleActual = nuevo;
    limpiarTrayectorias();
    crearControles();
  }

  const { w, h } = dimensionesCanvas();
  resizeCanvas(w, h);
  calcularPaneles();
  posicionarAcciones();
  G.bufDirty = true;
}

function encontrarPunto(mx, my, umbral) {
  let minD=Infinity, idx=null;
  for (let i=0; i<G.puntos.length; i++) {
    const {cx,cy} = d2c(paneles.P1, G.puntos[i].x, G.puntos[i].y);
    const d = Math.hypot(mx-cx, my-cy);
    if (d<minD) { minD=d; idx=i; }
  }
  return (minD <= umbral) ? idx : null;
}

function canvasToData(mx, my, panel) {
  const x0=panel.ox+PAD.l, y0=panel.oy+PAD.t;
  const pw=panel.cw-PAD.l-PAD.r, ph=panel.ch-PAD.t-PAD.b;
  return { xd: constrain((mx-x0)/pw,0,1), yd: constrain(1-(my-y0)/ph,0,1) };
}

function agregarPunto(mx, my) {
  const {xd,yd} = canvasToData(mx, my, paneles.P1);
  G.puntos.push({x:xd, y:yd});
}

function mousePressed() {
  if (G.estado === 'animando') return;
  if (!dentroDePanel(paneles.P1, mouseX, mouseY)) return;

  if (esModoSimple()) {
    if (G.puntos.length < 20) {
      agregarPunto(mouseX, mouseY);
      recalcularTodo();
    }
    return;
  }

  const idx = encontrarPunto(mouseX, mouseY, 12);

  if (idx !== null) {
    if (keyIsDown(CONTROL) || keyIsDown(SHIFT)) {
      G.puntos.splice(idx, 1);
      G.puntoDrag = null;
      recalcularTodo();
    } else {
      G.puntoDrag = idx;
    }
  } else {
    if (G.puntos.length < 20) {
      agregarPunto(mouseX, mouseY);
      recalcularTodo();
    }
  }
}

function mouseDragged() {
  if (G.puntoDrag === null) return;
  const {xd,yd} = canvasToData(mouseX, mouseY, paneles.P1);
  G.puntos[G.puntoDrag] = {x:xd, y:yd};
  recalcularTodo();
}

function mouseReleased() {
  G.puntoDrag = null;
}

function mouseMoved() {
  if (esModoSimple()) { G.hoverMB = null; return; }
  if (dentroDePanel(paneles.P2, mouseX, mouseY) &&
      G.puntos.length >= 3 && G.m_star !== null && G.bufHeatmap) {
    G.hoverMB = c2pParams(paneles.P2, mouseX, mouseY);
  } else {
    G.hoverMB = null;
  }
}
</script>
